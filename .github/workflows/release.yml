name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Build and verify
      run: ./gradlew build releaseBuildJar

    - name: Verify release version
      shell: bash
      run: |
        set -euo pipefail
        version="$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
        if [[ -z "$version" ]]; then
          echo "::error::Missing version entry in gradle.properties"
          exit 1
        fi
        if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match gradle.properties version v${version}"
          exit 1
        fi

    - name: Generate checksums
      shell: bash
      run: |
        set -euo pipefail
        version="$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
        jar="build/Avrix-Loader-${version}.jar"
        sources="build/Avrix-Loader-${version}-sources.jar"

        for file in "$jar" "$sources"; do
          if [[ ! -f "$file" ]]; then
            echo "::error::Expected release artifact not found: $file"
            exit 1
          fi
        done

        cd build
        sha256sum "Avrix-Loader-${version}.jar" "Avrix-Loader-${version}-sources.jar" > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Generate release notes
      shell: bash
      run: |
        set -euo pipefail

        notes_file="$RUNNER_TEMP/release-notes.md"
        prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
        if [[ -n "$prev_tag" ]]; then
          range="${prev_tag}..${GITHUB_REF_NAME}"
        else
          range="${GITHUB_REF_NAME}"
        fi

        declare -A titles=(
          [feat]="🚀 What's New"
          [fix]="🐛 Bug Fixes"
          [perf]="⚡ Performance"
          [refactor]="♻️ Refactoring"
          [test]="✅ Tests"
          [ci]="🤖 CI"
          [docs]="📝 Documentation"
          [build]="📦 Build"
          [chore]="🔧 Chores"
        )
        order=(feat fix perf refactor test ci docs build chore)
        declare -A body=()

        while IFS= read -r subject; do
          [[ -z "$subject" ]] && continue

          subject_lc="${subject,,}"
          [[ "$subject_lc" == merge\ * ]] && continue
          [[ "$subject_lc" == bump\ * ]] && continue

          type="other"
          scope=""
          text="$subject"
          commit_re='^([A-Za-z]+)(\(([^)]+)\))?!?:[[:space:]]+(.*)$'
          if [[ "$subject" =~ $commit_re ]]; then
            type="${BASH_REMATCH[1],,}"
            scope="${BASH_REMATCH[3]}"
            text="${BASH_REMATCH[4]}"
          fi

          [[ "$type" == "chore" && "$scope" == "deps" ]] && continue

          text="${text%.}"
          first="${text:0:1}"
          rest="${text:1}"
          first="$(printf '%s' "$first" | tr '[:lower:]' '[:upper:]')"
          text="${first}${rest}"

          prefix=""
          [[ -n "$scope" ]] && prefix="**${scope}:** "

          body[$type]+="- ${prefix}${text}"$'\n'
        done < <(git log --no-merges --pretty=tformat:'%s' "$range")

        {
          for key in "${order[@]}"; do
            [[ -n "${body[$key]:-}" ]] || continue
            printf '## %s\n\n%s\n' "${titles[$key]}" "${body[$key]}"
          done
          if [[ -n "${body[other]:-}" ]]; then
            printf '## 📦 Other Changes\n\n%s\n' "${body[other]}"
          fi
        } > "$notes_file"

        if ! grep -q '^- ' "$notes_file"; then
          printf '## 🔧 Maintenance\n\n- Internal maintenance and dependency updates.\n' > "$notes_file"
        fi

        if [[ -n "$prev_tag" ]]; then
          printf -- '---\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "$GITHUB_REPOSITORY" "$prev_tag" "$GITHUB_REF_NAME" >> "$notes_file"
        fi

        cat "$notes_file"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: build/Avrix-Loader-*.jar

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"

        gh release create "$GITHUB_REF_NAME" \
          "build/Avrix-Loader-${version}.jar" \
          "build/Avrix-Loader-${version}-sources.jar" \
          build/SHA256SUMS.txt \
          --title "Avrix ${version}" \
          --notes-file "$RUNNER_TEMP/release-notes.md" \
          --verify-tag
